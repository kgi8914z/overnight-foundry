name: night-shift
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, scout, brief, render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate.py
          python scripts/collect_pypi_updates.py
          python scripts/scout.py
          python scripts/measure.py
          python scripts/brief.py
          python scripts/render_dashboard.py
      - name: Commit factory books
        run: |
          git config user.name "overnight-foundry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json data backlog briefing ledger dashboard game
          if git diff --staged --quiet; then
            echo "no book changes"
          else
            git commit -m "chore: night shift books"
            git push
          fi
