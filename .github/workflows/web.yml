name: web
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "catalog.json"
      - "foundry.config.json"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          FOUNDRY_ROOT: ${{ github.workspace }}
