name: watch
description: 매일 커지는 공개 데이터 + viewer
labels: ["lane:watch", "work:build", "status:blocked"]
body:
  - type: input
    id: source
    attributes:
      label: Public feed / API URL
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License or terms
    validations:
      required: true
  - type: textarea
    id: expand
    attributes:
      label: Expansion path
      value: "dataset → viewer → API → utility"
    validations:
      required: true
  - type: input
    id: measure
    attributes:
      label: Measure
      value: "dataset_records + viewer_open"
    validations:
      required: true
  - type: textarea
    id: kill
    attributes:
      label: Kill
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      value: "로그인 스크레이핑, 개인정보, 애매한 ToS"
    validations:
      required: true
